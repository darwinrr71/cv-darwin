<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="DR">
  <defs>
    <!-- Soft premium blue gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E5BFF"/>
      <stop offset="55%" stop-color="#0F3EDC"/>
      <stop offset="100%" stop-color="#0A2A8F"/>
    </linearGradient>

    <!-- Subtle highlight -->
    <radialGradient id="shine" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Gentle shadow for letters -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="18" y="18" width="220" height="220" rx="54" fill="url(#bg)"/>

  <!-- Elegant thin border -->
  <rect x="18.5" y="18.5" width="219" height="219" rx="54"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Shine overlay -->
  <path d="M46 62c22-24 62-40 100-40 37 0 63 11 82 24
           6 4 7 12 2 18-24 28-58 45-94 45-36 0-63-10-90-23
           -7-3-9-12 0-24z"
        fill="url(#shine)"/>

  <!-- Monogram -->
  <g filter="url(#textShadow)">
    <text x="128" y="158"
          text-anchor="middle"
          font-size="112"
          font-weight="700"
          letter-spacing="-6"
          fill="#FFFFFF"
          font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji'">
      DR
    </text>

    <!-- Fine inner stroke to make it look crisp -->
    <text x="128" y="158"
          text-anchor="middle"
          font-size="112"
          font-weight="700"
          letter-spacing="-6"
          fill="none"
          stroke="#FFFFFF"
          stroke-opacity="0.35"
          stroke-width="1.6"
          paint-order="stroke"
          font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji'">
      DR
    </text>
  </g>
</svg>
